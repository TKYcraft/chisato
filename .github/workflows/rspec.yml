name: Rspec

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  rspec:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: build
      shell: bash
      run: |
        docker compose -f compose.yaml -f compose.rspec.yaml build
    - name: exec rspec
      run:  |
        docker compose -f compose.yaml -f compose.rspec.yaml run --rm -T app

  # Keep verifying that the production image still builds on every pull request.
  # The production image itself is pushed only by docker-build-prod-ci on main.
  build-prod-image:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: build prod image without pushing
      run: docker build -f Dockerfile.prod -t chisato:prod-check .
