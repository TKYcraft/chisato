services:
  app:
    environment:
      - RAILS_ENV=test
      - DISABLE_FOCUS_SPEC=true
    build:
      context: .
      dockerfile: ./Dockerfile
    image: "tkycraft/chisato:rspec"
    depends_on: {}
    healthcheck:
      disable: true
    entrypoint: []
    command: ["bundle", "exec", "rspec"]
